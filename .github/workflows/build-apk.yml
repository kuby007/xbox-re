name: Build Hiker APK

# 自建包：不发布 Release、不碰你的签名材料，只把 4 个安装包编出来当 artifact 供下载。
# 触发方式：
#   1) 在 Actions 页面点 "Run workflow"
#   2) （已移除 push 触发，避免与 release 工作流双跑）
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "编哪些包"
        required: false
        default: all
        type: choice
        options:
          - all          # 手机 + TV，arm64 + armv7a 共 4 个
          - arm64        # 只编 arm64（手机 + TV）
          - mobile       # 只编手机
          - leanback     # 只编 TV
  # push 触发已移除：本分支的 release 包由 android-release.yml 出，
  # 两个工作流同时跑会互相抢 runner 并产生同名产物。需要自动编 debug 包时
  # 在 Actions 页面点 "Run workflow" 即可。

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install SDK components
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          # 注意：API 37 的包名是 platforms;android-37.0，不是 android-37
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Point SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Build debug APKs
        run: |
          set -eux
          chmod +x gradlew
          case "${{ github.event.inputs.variant || 'all' }}" in
            arm64)    TASKS=":app:assembleMobileArm64_v8aDebug :app:assembleLeanbackArm64_v8aDebug" ;;
            mobile)   TASKS=":app:assembleMobileArm64_v8aDebug :app:assembleMobileArmeabi_v7aDebug" ;;
            leanback) TASKS=":app:assembleLeanbackArm64_v8aDebug :app:assembleLeanbackArmeabi_v7aDebug" ;;
            *)        TASKS=":app:assembleMobileArm64_v8aDebug :app:assembleLeanbackArm64_v8aDebug :app:assembleMobileArmeabi_v7aDebug :app:assembleLeanbackArmeabi_v7aDebug" ;;
          esac
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -eux
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hiker-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  # 可选：如果你的仓库里配了签名 Secrets，就再出一个 release 包
  #   需要 4 个 secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  #   没配也不会失败，整个 job 直接跳过
  release-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check signing secrets
        id: check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "没有配签名 Secrets，跳过 release 构建（debug 包已经在上面那个 artifact 里了）"
          fi

      - name: Checkout
        if: steps.check.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        if: steps.check.outputs.ok == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: steps.check.outputs.ok == '1'
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK components
        if: steps.check.outputs.ok == '1'
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;${BUILD_TOOLS}" \
            "platform-tools" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Write keystore + local.properties
        if: steps.check.outputs.ok == '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eux
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          storeFile=release.jks
          keyAlias=${KEY_ALIAS}
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release APKs
        if: steps.check.outputs.ok == '1'
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease :app:assembleLeanbackArm64_v8aRelease --no-daemon --stacktrace

      - name: Upload signed APKs
        if: steps.check.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: hiker-apk-release-${{ github.sha }}
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 14
