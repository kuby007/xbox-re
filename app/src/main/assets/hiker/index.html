<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>小程序</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">小</div>
    <div class="title" id="ruleTitle">我的小程序</div>
    <button class="ibtn" id="backBtn" style="display:none">‹</button>
    <button class="ibtn" id="importBtn">＋</button>
  </header>

  <!-- 站点列表 -->
  <div id="viewSites">
    <div id="siteList"></div>
    <button class="btn primary" id="importBtn2" style="width:100%;margin-top:14px" onclick="document.getElementById('importBtn').click()">
      导入口令
    </button>
    <div class="dim" style="text-align:center;margin-top:12px">
      粘贴「云6oooole/…」这类口令即可导入
    </div>
  </div>

  <!-- 规则页 -->
  <div id="viewRule" style="display:none">
    <div id="content"></div>
  </div>

  <div id="diagLog"></div>
</div>

<!-- 导入弹层 -->
<div class="mask" id="importMask">
  <div class="sheet">
    <h3>导入小程序</h3>
    <!-- 五种来源排成一行，左右滑动切换，不再上下堆成一坨。 -->
    <div class="modes" id="modeRow">
      <button class="mbtn on" data-mode="code">口令</button>
      <button class="mbtn" data-mode="pwd">带密码</button>
      <button class="mbtn" data-mode="file">文件导入</button>
      <button class="mbtn" data-mode="json">粘贴规则</button>
      <button class="mbtn" data-mode="clip">剪贴板</button>
    </div>
    <p class="hint" id="importHint">云口令、分享口令都行，多条一行一条。</p>

    <textarea id="importText" placeholder="云6oooole/xxxxxx/xxxx"></textarea>
    <input class="f" id="importPwd" type="password" placeholder="口令密码（带密码的口令才需要）"
           style="display:none;margin-top:10px">

    <div id="filePane" style="display:none">
      <button class="btn gh" id="fileBtn" style="width:100%">选择小程序文件（.hkzip / .zip / .json）</button>
      <div class="dim" id="fileName" style="margin-top:8px"></div>
    </div>

    <div class="row">
      <button class="btn gh" id="clipBtn">读剪贴板</button>
      <button class="btn gh" id="importCancel">取消</button>
      <button class="btn primary" id="importOk">导入</button>
    </div>
  </div>
</div>

<div class="mask" id="pickMask">
  <div class="sheet">
    <h3 id="pickTitle">请选择</h3>
    <div class="scroll-row" id="pickRow" style="flex-wrap:nowrap;padding-bottom:12px"></div>
    <div class="row">
      <button class="btn gh" id="pickCancel">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="busy"></div>

<script src="hiker_engine.js"></script>
<script src="hiker_import.js"></script>
<script src="hiker_ui.js"></script>
<script>
  window.addEventListener('load', function () {
    try { HikerUI.boot(); }
    catch (e) { document.getElementById('siteList').innerHTML =
      '<div class="empty">启动失败：' + (e && e.message) + '</div>'; }
  });
</script>
</body>
</html>
