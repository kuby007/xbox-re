<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>小程序</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 配色对齐宿主 App：Material3 深色 + colorPrimary #1A73E8（app/src/main/res/values/styles.xml） */
:root{
  --bg:#101014;--card:#1C1B1F;--card2:#242328;--line:#33323A;
  --txt:#E6E1E5;--sub:#A8A5AC;--dim:#7C7981;--acc:#1A73E8;--acc2:#1A73E8;
  --ok:#48D19A;--warn:#F0A55A;--bad:#F2706F;
}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none}
.wrap{max-width:980px;margin:0 auto;padding:0 12px calc(18px + env(safe-area-inset-bottom,0px))}

/* 顶栏 */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 2px 10px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.logo{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--acc);color:#fff;font-weight:700;font-size:14px}
.title{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{background:var(--card2)}

/* 站点卡片 */
.grid-sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;position:relative}
.card:active{transform:scale(.985)}
.site-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;margin-bottom:10px}
.site-nm{font-size:15px;font-weight:700;word-break:break-all;padding-right:34px}
.site-mt{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.pill{font:10px/1 monospace;padding:3px 6px;border-radius:5px;background:#26313f;color:var(--sub)}
.del{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:12px;padding:0;cursor:pointer}

/* 内容区 */
#content{min-height:60vh;padding-bottom:26px}
.grid{display:grid;gap:11px}
.poster{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.poster:active{transform:scale(.97)}
.poster .ph{aspect-ratio:2/3;background:var(--card2);display:flex;
  align-items:center;justify-content:center;color:var(--dim);font-size:20px;font-weight:700;overflow:hidden}
.poster .ph img{width:100%;height:100%;object-fit:cover;display:block}
.poster .pt{padding:7px 8px 9px}
.poster .pt b{display:block;font-size:12.5px;font-weight:600;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .pt span{display:block;font-size:11px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sect-t{font-size:14px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;gap:8px;color:var(--txt)}
.sect-t:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--acc)}
.row-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  color:var(--txt);border-radius:11px;padding:12px 14px;font-size:14px;margin-bottom:8px;cursor:pointer}
.row-btn:active{background:var(--card2)}
.chip{display:inline-block;margin:0 8px 8px 0;background:var(--card);border:1px solid var(--line);
  color:var(--sub);border-radius:18px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip:active{background:var(--card2)}
.chip[style*="background:#22c55e"]{color:#fff;font-weight:700}
.center-line{text-align:center;color:var(--dim);font-size:13px;padding:10px 0}
.hr{height:1px;background:var(--line);margin:14px 0;opacity:.7}
.rich{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;
  font-size:13.5px;line-height:1.7;color:var(--sub);word-break:break-word}
.rich a{color:var(--acc);text-decoration:none}
.rich b,.rich font{color:var(--txt)}

.hero-card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px;margin:6px 0 14px}
.hero-card.grad{background:var(--card2)}
.hero-pic{width:104px;flex:none;aspect-ratio:2/3;border-radius:10px;overflow:hidden;
  background:var(--card2);display:flex;align-items:center;justify-content:center}
.hero-pic img{width:100%;height:100%;object-fit:cover}
.hero-ph{font-size:32px;font-weight:700;color:var(--dim)}
.hero-info{flex:1;min-width:0}
.hero-info h2{margin:2px 0 8px;font-size:18px;line-height:1.35}
.hero-info p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.65}

.input-row{display:flex;gap:8px;margin:6px 0 12px}
input.f{flex:1;min-width:0;background:#0b1119;color:var(--txt);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font-size:14px;outline:none}
input.f:focus{border-color:var(--acc)}
.btn{border-radius:11px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
.btn.primary{background:var(--acc);border:none;color:#fff}
.btn.gh{background:var(--card2);color:var(--txt)}

.empty{text-align:center;color:var(--sub);padding:56px 16px;font-size:14px;line-height:1.9}
.empty .big{display:block;font-size:40px;margin-bottom:10px;opacity:.6}
.dim{color:var(--dim);font-size:12.5px}

/* 导入弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end}
.mask.show{display:flex}
.sheet{width:100%;max-width:980px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet .hint{color:var(--dim);font-size:12px;margin:0 0 12px;line-height:1.7}
textarea{width:100%;min-height:120px;background:#0b1119;color:var(--txt);border:1px solid var(--line);
  border-radius:11px;padding:11px;font:13px/1.6 monospace;resize:vertical;outline:none}
textarea:focus{border-color:var(--acc)}
.sheet .row{display:flex;gap:9px;margin-top:12px}
.sheet .row .btn{flex:1}

/* 其它 */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  background:#0b1119f2;border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:11px;
  font-size:13.5px;z-index:80;opacity:0;transition:.22s;max-width:86%;text-align:center;
  box-shadow:0 10px 34px #0009;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;display:none;
  background:#0b1119f2;border:1px solid var(--line);border-radius:13px;padding:16px 22px;font-size:14px;
  box-shadow:0 14px 40px #000a}
#busy.show{display:block}
#busy:after{content:"";display:block;margin:10px auto 0;width:20px;height:20px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#diagLog{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">小</div>
    <div class="title" id="ruleTitle">我的小程序</div>
    <button class="ibtn" id="backBtn" style="display:none">‹</button>
    <button class="ibtn" id="importBtn">＋</button>
  </header>

  <!-- 站点列表 -->
  <div id="viewSites">
    <div id="siteList"></div>
    <button class="btn primary" id="importBtn2" style="width:100%;margin-top:14px" onclick="document.getElementById('importBtn').click()">
      导入口令
    </button>
    <div class="dim" style="text-align:center;margin-top:12px">
      粘贴「云6oooole/…」这类口令即可导入
    </div>
  </div>

  <!-- 规则页 -->
  <div id="viewRule" style="display:none">
    <div id="content"></div>
  </div>

  <div id="diagLog"></div>
</div>

<!-- 导入弹层 -->
<div class="mask" id="importMask">
  <div class="sheet">
    <h3>导入口令</h3>
    <p class="hint">支持：云口令（云6oooole/xxxxxx/…）、分享口令、规则 JSON、订阅地址。多条口令请一行一条。</p>
    <textarea id="importText" placeholder="把口令粘到这里"></textarea>
    <div class="row">
      <button class="btn gh" id="clipBtn">读剪贴板</button>
      <button class="btn gh" id="importCancel">取消</button>
      <button class="btn primary" id="importOk">导入</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="busy"></div>

<script src="hiker_engine.js"></script>
<script src="hiker_import.js"></script>
<script src="hiker_ui.js"></script>
<script>
  window.addEventListener('load', function () {
    try { HikerUI.boot(); }
    catch (e) { document.getElementById('siteList').innerHTML =
      '<div class="empty">启动失败：' + (e && e.message) + '</div>'; }
  });
</script>
</body>
</html>
